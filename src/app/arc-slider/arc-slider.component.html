@let info = gaugeInfo();
@let opts = options();
@let size = frameSize();
@let diameter = scalledDiameter();

<div [class]="['component-container']">
  <div
    [id]="'arc-' + gaugeId()"
    class="arc-slider"
    [style]="{ width: diameter + 'px', height: diameter + 'px' }"
  >
  
  <div class="controls-info">
    <div
      class="target-value-container"
      [style]="{ transform: 'translateY(' + 30 + 'px)' }"
    >
      <div class="main-target-container">
        @if (isActive()) {
          <span
            class="target-label regular-text text-med-color"
            [class]="size === 'S' ? 'xs-size-text' : 's-size-text'"
            [style]="{ transform: 'translateY(' + (size !== 'L' ? 10 : 0) + 'px)' }"
            >{{ info.targetPrefixLabel }}</span
          >
        }
        <span
          [class]="[
            'current-precised-value',
            'semi-bold-text',
            info.targetLabelColor,
            size === 'S' ? 'small' : 'large',
          ]"
          [style]="{ transform: 'translateY(' + (size !== 'L' ? 8 : 0) + 'px)' }"
          >{{ isActive() ? precisedValue() + opts.symbol : 'Off' }}</span
        >
      </div>
    </div>
  </div>

    <canvas
      #backgroundCanvas
      class="background-canvas"
      [width]="frameDiameter()"
      [height]="frameDiameter()"
      [style]="{
        transform: 'scale(' + scaleFactor + ') translate(-' + diameter + 'px, -' + diameter + 'px)',
      }"
    ></canvas>
    <canvas
      #mainCanvas
      class="main-canvas"
      [width]="frameDiameter()"
      [height]="frameDiameter()"
      [style]="{
        transform: 'scale(' + scaleFactor + ') translate(-' + diameter + 'px, -' + diameter + 'px)',
        cursor: isActive() ? 'pointer' : 'default',
      }"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp()"
      (pointercancel)="onPointerUp()"
    ></canvas>
  </div>

  <div class="control-btns">
    <!--MINUS-->
    <div
      class="fine-control-btn"
      [style]="{
        transform: 'translate(0, ' + -0.75 + 'rem)',
      }"
    >
      <!--Minus btn-->
      <button
        type="button"
        class="control-btn"
        aria-label="Decrease"
        [attr.aria-disabled]="minusDisabled()"
        [style.cursor]="minusDisabled() ? 'default' : 'pointer'"
        (click)="onControlBtn('minus')"
      >
        <img ngSrc="assets/icon-minus-48.png" width="48" height="48" alt="" />
      </button>
    </div>


    <!--POWER-->
    <div
        class="pwr-btn-container"
        [style]="{
          transform:
            'translate(0, -' +
            diameter * (size === 'L' ? 0.56 : size === 'M' ? 0.58 : 0.6) +
            'px)',
        }"
      >
        <!--Power btn-->
        <button
          class="pwr-btn"
          (click)="onPowerBtn()"
        >
          <img ngSrc="assets/icon-power-64.png" width="64" height="64" alt="" />
        </button>
      </div>

    
    <!--PLUS-->
    <div
      class="fine-control-btn"
      [style]="{
        transform: 'translate(0, ' + -0.75 + 'rem)',
      }"
    >
      <!--Plus btn-->
      <button
        type="button"
        class="control-btn"
        aria-label="Increase"
        [attr.aria-disabled]="plusDisabled()"
        [style.cursor]="plusDisabled() ? 'default' : 'pointer'"
        (click)="onControlBtn('plus')"
      >
        <img ngSrc="assets/icon-plus-48.png" width="48" height="48" alt="" />
      </button>
    </div>
  </div>
</div>
